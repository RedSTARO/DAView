# ---- Gradle ----
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain: Android Studio's JBR 21 is used for compilation so that AGP/KMP
# run on a JDK combination they support even if a newer JDK is on PATH.
org.gradle.java.installations.auto-detect=true

# ---- Kotlin ----
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.native.ignoreDisabledTargets=true

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 blocks the classic com.android.{library,application} + KMP combination.
# These two flags keep the well-trodden KMP layout working until the new
# com.android.kotlin.multiplatform.library DSL is used everywhere.
android.builtInKotlin=false
android.newDsl=false
