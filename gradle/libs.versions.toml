[versions]
kotlin = "2.4.20"
compose = "1.12.0"
# Material 3 Expressive (MaterialExpressiveTheme, MaterialShapes, ButtonGroup, ...)
# is still internal in the stable material3 1.9.0 that the Compose plugin pins,
# so the module is declared explicitly.
composeMaterial3 = "1.12.0-alpha03"
agp = "9.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
sqliteJdbc = "3.53.4.0"
logback = "1.5.20"
coil = "3.6.2"
okhttp = "5.3.2"
androidxSqlite = "2.6.1"
slf4jSimple = "2.0.17"
androidxActivity = "1.13.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
media3 = "1.11.0"
# For :ffmpeg-decoder, whose Java sources (media3's FFmpeg extension) use
# both annotation libraries; media3 does not put either on its API classpath.
androidxAnnotation = "1.9.1"
checkerQual = "3.43.0"
lifecycle = "2.11.0"
jna = "5.19.1"
androidCompileSdk = "37"
androidMinSdk = "26"
androidTargetSdk = "37"

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimple" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
checkerframework-qual = { module = "org.checkerframework:checker-qual", version.ref = "checkerQual" }

jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
