<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DAView</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0E0D14; overflow: hidden; }
        #loading {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #C9BCFF; font: 500 15px/1.4 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">DAView 正在加载…</div>
    <script type="application/javascript" src="daview.js"></script>
    <script>
        window.addEventListener('load', function () {
            var node = document.getElementById('loading');
            if (node) { setTimeout(function () { node.remove(); }, 1200); }
        });
    </script>
</body>
</html>
