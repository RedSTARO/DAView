name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The daemon buys nothing on a runner that is thrown away afterwards, and it
  # is the first thing to fall over when the machine is short on memory.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: 服务端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :server:jvmTest

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: server/build/reports/tests/jvmTest
          if-no-files-found: ignore

  msi:
    name: 桌面端 MSI
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # jpackage builds the MSI through WiX and refuses to start without it, and
      # it only accepts WiX 3.x. The runner image ships some 3.x already, so
      # install only when it is missing and always put whatever is there on PATH
      # (pinning a version makes choco fail against a newer one).
      - name: 准备 WiX Toolset 3
        run: |
          function Find-Wix {
            Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3.*" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          $wix = Find-Wix
          if (-not $wix) {
            choco install wixtoolset --no-progress -y
            $wix = Find-Wix
          }
          if (-not $wix) { throw "WiX Toolset 3 not found after install" }
          Write-Host "using $($wix.FullName)"
          "$($wix.FullName)\bin" >> $env:GITHUB_PATH

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :composeApp:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # compileSdk is 37, which the whole Compose 1.12 / Material3 1.5 stack
      # requires. Google publishes it as android-37.0, not android-37 — the bare
      # name does not exist in the repository and sdkmanager fails on it.
      - name: 安装 compile SDK
        run: sdkmanager --install "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v4

      # Debug rather than release: a release APK without a keystore comes out
      # unsigned and will not install. See README for wiring up signing keys.
      - run: ./gradlew :composeApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: 发布到 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msi, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/DAView-msi/*.msi \
            artifacts/DAView-apk/*.apk \
            --clobber
