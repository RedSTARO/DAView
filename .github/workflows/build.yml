name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The daemon buys nothing on a runner that is thrown away afterwards, and it
  # is the first thing to fall over when the machine is short on memory.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: 服务端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :server:test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: server/build/reports/tests/test
          if-no-files-found: ignore

  msi:
    name: 桌面端 MSI
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # jpackage builds the MSI through WiX and refuses to start without it.
      # Recent runner images no longer ship WiX 3, and jpackage does not accept
      # WiX 4/5, so it is pinned here.
      - name: 安装 WiX Toolset 3
        run: |
          choco install wixtoolset --version=3.11.2 --no-progress -y
          "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :composeApp:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # compileSdk is 37 (Coil 3.6 requires it). Installing it explicitly means a
      # missing platform fails here with an obvious message instead of inside AGP.
      - name: 安装 compile SDK
        run: sdkmanager --install "platforms;android-${{ env.COMPILE_SDK }}"
        env:
          COMPILE_SDK: "37"

      - uses: gradle/actions/setup-gradle@v4

      # Debug rather than release: a release APK without a keystore comes out
      # unsigned and will not install. See README for wiring up signing keys.
      - run: ./gradlew :composeApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: 发布到 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msi, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/DAView-msi/*.msi \
            artifacts/DAView-apk/*.apk \
            --clobber
