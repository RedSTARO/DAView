name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only unless a job says otherwise: only the two publishing jobs write,
# and they ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless. On master
  # and on tags it does not: cancelling a run there could stop publish-ci half
  # way through replacing the packages every installed copy updates from, so
  # a newer run waits for the older one to finish instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The daemon buys nothing on a runner that is thrown away afterwards, and it
  # is the first thing to fall over when the machine is short on memory.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: 服务端测试
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      commit_msg: ${{ steps.meta.outputs.commit_msg }}
      commit_count: ${{ steps.meta.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :core:jvmTest

      # There is no dynamic version scheme in the Gradle build, so the human
      # label for artifacts and release notes is resolved here: the tag name for
      # a tag build, otherwise `git describe` (nearest tag + commits + short sha)
      # or a bare short sha when no tag exists yet.
      - name: 解析版本信息
        id: meta
        run: |
          git fetch --force --tags >/dev/null 2>&1 || true
          # Only v* tags are versions. The `ci` tag moves with every master
          # build (see publish-ci) and would otherwise be the nearest tag.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always --match 'v*' 2>/dev/null || git rev-parse --short HEAD)"
          fi
          # What the installers carry, which is not the label above. Windows
          # compares MAJOR.MINOR.PATCH and refuses a package whose version
          # equals the installed one, so this has to rise on every build — the
          # label does not (`git describe` output is not even numeric). Major
          # and minor come from the newest tag; the patch is the total commit
          # count, which is the one number that only ever goes up, including
          # across a tag. So an installer always replaces the one before it.
          # 1.0 rather than 0.1 when there is no tag: every copy installed so
          # far reports 1.0.0, and Windows refuses to go backwards, so anything
          # below that would be rejected as a downgrade instead.
          package_major=1
          package_minor=0
          newest_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')"
          if [[ "$newest_tag" =~ ^v?([0-9]+)\.([0-9]+) ]]; then
            package_major="${BASH_REMATCH[1]}"
            package_minor="${BASH_REMATCH[2]}"
          fi
          package_patch="$(git rev-list --count HEAD)"

          latest_tag="$(git tag --list 'v*' --sort=-creatordate | head -n1)"
          if [ -z "$latest_tag" ]; then
            count="$(git rev-list --count HEAD)"
          else
            count="$(git rev-list --count "${latest_tag}..HEAD")"
          fi
          {
            echo "version=$version"
            echo "package_version=$package_major.$package_minor.$package_patch"
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "commit_msg=$(git log -1 --pretty=%s)"
            echo "commit_count=$count"
          } >> "$GITHUB_OUTPUT"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/jvmTest
          if-no-files-found: ignore

  # ─── Android ────────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The action installs "tools platform-tools" unless told otherwise, and
      # the legacy "tools" package is gone from the SDK repository: sdkmanager
      # 16 answers "Failed to find package 'tools'" and the step fails before
      # anything is built. platform-tools is all this build needs from it.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # compileSdk is 37, which the whole Compose 1.12 / Material3 1.5 stack
      # requires. Google publishes it as android-37.0, not android-37 — the bare
      # name does not exist in the repository and sdkmanager fails on it.
      - name: 安装 compile SDK
        run: sdkmanager --install "platforms;android-37.0"

      # Most phones cannot decode DTS or TrueHD, and some lack AC-3/E-AC-3, so
      # the app carries FFmpeg's decoders for them, built here rather than
      # taken from someone else's AAR: scripts/build-ffmpeg-decoder.sh compiles
      # FFmpeg (LGPL only, as shared libraries) and media3's JNI wrapper for
      # all four ABIs, and the :ffmpeg-decoder module packages what it writes
      # to build/ffmpeg-decoder/jniLibs. The script holds the pinned FFmpeg tag
      # and NDK version; the steps below read them from it.
      - name: 读取 FFmpeg 与 NDK 版本
        id: ffmpeg-pins
        run: bash scripts/build-ffmpeg-decoder.sh --print-pins >> "$GITHUB_OUTPUT"

      # The libraries change only with the script, the wrapper's source, the
      # FFmpeg tag or the NDK, so a build that touches none of them reuses the
      # last result. Two more inputs are in the key because the script checks
      # them and a cache hit skips the script: the Java sources, whose native
      # methods the wrapper's exports must match, and the licence files, which
      # must match FFmpeg's COPYING and name every file whose licence asks for
      # a notice. No restore-keys: an older build is never a substitute.
      # Restore and save are separate steps so that a fresh build is cached
      # even when Gradle fails afterwards.
      - name: 恢复 FFmpeg 解码库缓存
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ffmpeg-decoder/jniLibs
            build/ffmpeg-decoder/build-info.txt
          key: ffmpeg-decoder-${{ steps.ffmpeg-pins.outputs.ffmpeg_tag }}-ndk${{ steps.ffmpeg-pins.outputs.ndk_version }}-${{ hashFiles('scripts/build-ffmpeg-decoder.sh', 'ffmpeg-decoder/src/main/jni/**', 'ffmpeg-decoder/src/main/java/**', 'ffmpeg-decoder/src/main/assets/licenses/**') }}

      # That exact NDK rather than whichever the runner image happens to ship:
      # the script refuses any other revision.
      - name: 安装 NDK
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ steps.ffmpeg-pins.outputs.ndk_version }}"

      # Clones FFmpeg at the pinned tag (shallow), checks its commit, then
      # builds and verifies every library; see ffmpeg-decoder/README.md.
      - name: 编译 FFmpeg 解码库
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: >-
          bash scripts/build-ffmpeg-decoder.sh
          --ndk "$ANDROID_HOME/ndk/${{ steps.ffmpeg-pins.outputs.ndk_version }}"
          --ffmpeg "$RUNNER_TEMP/ffmpeg"
          --out build/ffmpeg-decoder

      - name: 保存 FFmpeg 解码库缓存
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/ffmpeg-decoder/jniLibs
            build/ffmpeg-decoder/build-info.txt
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      # Without these the module still compiles and the APK still installs; it
      # just plays no DTS or TrueHD. The job stops here instead, and checks
      # the APK itself after Gradle. The hashes are printed so that a local
      # build of the same pins can be compared with this one.
      - name: 检查 FFmpeg 解码库
        run: |
          missing=0
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in avutil swresample avcodec ffmpegJNI; do
              file="build/ffmpeg-decoder/jniLibs/$abi/lib$lib.so"
              if [ -s "$file" ]; then
                ls -l "$file"
              else
                echo "::error::$file is missing"
                missing=1
              fi
            done
          done
          cat build/ffmpeg-decoder/build-info.txt || true
          if [ "$missing" = 0 ]; then
            (cd build/ffmpeg-decoder/jniLibs && sha256sum */*.so)
          fi
          exit "$missing"

      - uses: gradle/actions/setup-gradle@v4

      # The release variant, unsigned. `isMinifyEnabled` stays off in the Gradle
      # build on purpose: the app embeds the scanning/scraping/SQLite core and
      # relies on kotlinx.serialization reflection, and R8 without a curated set
      # of keep rules strips those at runtime. Signing is done as a separate step
      # below, so this artifact is the input to signing, not a shippable APK.
      - run: >-
          ./gradlew :composeApp:assembleRelease
          "-PdaviewVersion=${{ needs.test.outputs.version }}"
          "-PdaviewPackageVersion=${{ needs.test.outputs.package_version }}"

      # The check before Gradle looks at what went in; this looks at what came
      # out, so a packaging mistake in :ffmpeg-decoder cannot pass for a build
      # with FFmpeg. The APK must hold all 16 libraries, each stored on a 16 KB
      # boundary (Android 15+ devices with 16 KB pages map them straight out
      # of the APK) or compressed, with 16 KB-aligned segments, and the licence
      # files exactly as in the repository. Signing happens in the next job.
      - name: 检查 APK 中的 FFmpeg 解码库
        run: >-
          bash scripts/build-ffmpeg-decoder.sh --check-apk
          composeApp/build/outputs/apk/release/*-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-apk-unsigned
          path: composeApp/build/outputs/apk/release/*-release-unsigned.apk
          if-no-files-found: error

  # Signs the release APK. Runs only on master/main and tag pushes, where the
  # signing secrets are available; pull requests (including forks) build the
  # unsigned APK above and stop there.
  sign-android:
    name: 签名 Android Release
    needs: [test, build-android]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DAView-apk-unsigned
          path: unsigned

      # The SDK's own apksigner, called directly. This used to go through a
      # third-party action last released in 2019 (declared for node12), which
      # meant somebody else's mutable tag ran with the keystore in hand and put
      # both passwords on a command line. Here the passwords reach apksigner
      # through the environment and the keystore file is gone before the job
      # ends. The APK arrives aligned from Gradle (the build job checks the
      # native libraries' 16 KB alignment); signing does not move anything, and
      # zipalign -c confirms the archive is still aligned before it is signed.
      - name: 签名 APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "using $build_tools"
          unsigned="$(find unsigned -name '*.apk' -print -quit)"
          test -n "$unsigned"

          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode --ignore-garbage > "$keystore"

          "$build_tools/zipalign" -c 4 "$unsigned"

          mkdir -p signed
          signed="signed/DAView-${VERSION}.apk"
          # No v4 signature: it is a separate .idsig file only `adb install
          # --incremental` reads, and nothing here ships it.
          args=(sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_STORE_PASSWORD --v4-signing-enabled false)
          # A PKCS12 store has one password for both; only pass a key password
          # when one is configured.
          if [ -n "${KEY_PASSWORD:-}" ]; then
            args+=(--key-pass env:KEY_PASSWORD)
          fi
          "$build_tools/apksigner" "${args[@]}" --out "$signed" "$unsigned"
          "$build_tools/apksigner" verify --print-certs "$signed" | grep -i 'SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-apk-signed
          path: signed/DAView-${{ needs.test.outputs.version }}.apk
          if-no-files-found: error

  # ─── Desktop · Windows ──────────────────────────────────────────────────────
  build-desktop-windows:
    name: 桌面端 · Windows (.msi)
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # jpackage builds the MSI through WiX and refuses to start without it, and
      # it only accepts WiX 3.x. The runner image ships some 3.x already, so
      # install only when it is missing and always put whatever is there on PATH
      # (pinning a version makes choco fail against a newer one).
      - name: 准备 WiX Toolset 3
        run: |
          function Find-Wix {
            Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3.*" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          $wix = Find-Wix
          if (-not $wix) {
            choco install wixtoolset --no-progress -y
            $wix = Find-Wix
          }
          if (-not $wix) { throw "WiX Toolset 3 not found after install" }
          Write-Host "using $($wix.FullName)"
          "$($wix.FullName)\bin" >> $env:GITHUB_PATH

      - uses: gradle/actions/setup-gradle@v4

      # The in-app player. Not in git — 115 MB — so the MSI only carries it if
      # this runs first. A failure here is not fatal to the package: the desktop
      # app falls back to launching PotPlayer/VLC/mpv, which is what it did
      # before there was an embedded engine at all.
      # The desktop-only tests live here rather than in the ubuntu test job:
      # :composeApp also carries the Android application plugin, and this is the
      # runner that already configures and builds that module.
      - run: ./gradlew :composeApp:desktopTest

      - name: 取得 libmpv
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-libmpv.ps1

      # Quoted, and it has to be: this job runs in PowerShell, which splits an
      # unquoted `-PdaviewPackageVersion=1.0.85` at the first dot and hands
      # Gradle `-PdaviewPackageVersion=1` plus `.0.85` as a second argument it
      # reads as a task name. Git Bash passes the same string through untouched,
      # so this is invisible everywhere except the one job that needs it.
      - run: ./gradlew :composeApp:packageMsi "-PdaviewVersion=${{ needs.test.outputs.version }}" "-PdaviewPackageVersion=${{ needs.test.outputs.package_version }}"

      - name: 重命名 MSI
        run: |
          $pkg = Get-ChildItem composeApp/build/compose/binaries/main/msi -Filter *.msi | Select-Object -First 1
          if (-not $pkg) { throw "MSI package was not produced." }
          Move-Item -LiteralPath $pkg.FullName -Destination (Join-Path $pkg.DirectoryName "DAView-$env:VERSION.msi")

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-msi
          path: composeApp/build/compose/binaries/main/msi/DAView-${{ needs.test.outputs.version }}.msi
          if-no-files-found: error

  # ─── Desktop · Linux ────────────────────────────────────────────────────────
  build-desktop-linux:
    name: 桌面端 · Linux (.deb)
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :composeApp:packageDeb "-PdaviewVersion=${{ needs.test.outputs.version }}" "-PdaviewPackageVersion=${{ needs.test.outputs.package_version }}"

      - name: 重命名 deb
        run: |
          pkg=$(find composeApp/build/compose/binaries/main/deb -name '*.deb' -print -quit)
          test -n "$pkg"
          mv "$pkg" "$(dirname "$pkg")/DAView-${VERSION}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-deb
          path: composeApp/build/compose/binaries/main/deb/DAView-${{ needs.test.outputs.version }}.deb
          if-no-files-found: error

  # ─── Desktop · macOS ────────────────────────────────────────────────────────
  build-desktop-macos:
    name: 桌面端 · macOS (.dmg)
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :composeApp:packageDmg "-PdaviewVersion=${{ needs.test.outputs.version }}" "-PdaviewPackageVersion=${{ needs.test.outputs.package_version }}"

      - name: 重命名 dmg
        run: |
          pkg=$(find composeApp/build/compose/binaries/main/dmg -name '*.dmg' -print -quit)
          test -n "$pkg"
          mv "$pkg" "$(dirname "$pkg")/DAView-${VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: DAView-dmg
          path: composeApp/build/compose/binaries/main/dmg/DAView-${{ needs.test.outputs.version }}.dmg
          if-no-files-found: error

  # ─── CI 版本（每次 master 推送）─────────────────────────────────────────────
  # Every build of master is an update the app can install. Workflow artifacts
  # need a token to download, which the app has not got, so the packages go on
  # a rolling pre-release under the fixed tag `ci`, and the manifest that names
  # them goes to the `updates` branch, where the app reads it. Tagged releases
  # publish the same way; the app takes whichever manifest was written last,
  # and its package version only ever rises with the commit count.
  publish-ci:
    name: 发布 CI 版本
    needs:
      - test
      - sign-android
      - build-desktop-windows
      - build-desktop-linux
      - build-desktop-macos
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
      PACKAGE_VERSION: ${{ needs.test.outputs.package_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The test report lands in dist/ too, and the unsigned APK is the input
      # to signing, not something anyone installs.
      - name: 只留安装包
        run: |
          rm -f dist/*unsigned*.apk
          find dist -type f ! -name 'DAView-*' -delete
          ls -l dist

      - name: 生成更新清单
        run: |
          {
            echo "CI 构建 $VERSION（${{ github.sha }}）"
            echo
            git log -8 --pretty='- %s'
          } > /tmp/notes.txt
          python3 scripts/update-manifest.py dist dist/update.json \
            --repo "${{ github.repository }}" \
            --tag ci \
            --version "$VERSION" \
            --package-version "$PACKAGE_VERSION" \
            --notes-file /tmp/notes.txt
          cat dist/update.json

      # Edited in place, never taken down. It used to be deleted and created
      # again, and a run that stopped in between — cancelled by the next push,
      # a runner lost, a network error — left the manifest on `updates` naming
      # packages that no longer existed, so every installed copy failed to
      # update until a later run got through. Now the tag moves to this
      # commit, the new packages go up beside the old ones, the manifest is
      # switched over, and only then are the old packages removed. Neither the
      # tag nor the branch sets this workflow off again: it runs on v* tags
      # and on master only.
      - name: 上传到 ci 预发布
        run: |
          set -euo pipefail
          if gh release view ci >/dev/null 2>&1; then
            git tag -f ci "$GITHUB_SHA"
            git push --force origin refs/tags/ci
            gh release edit ci --prerelease --title "CI 构建 $VERSION" --notes-file /tmp/notes.txt
            gh release upload ci dist/DAView-* dist/update.json --clobber
          else
            gh release create ci dist/DAView-* dist/update.json \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "CI 构建 $VERSION" \
              --notes-file /tmp/notes.txt
          fi

      - name: 发布更新清单到 updates 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dist/update.json /tmp/update.json
          git checkout --orphan updates
          git rm -rf --quiet .
          cp /tmp/update.json update.json
          git add update.json
          git commit -m "update manifest for $VERSION"
          git push --force origin updates

      # Last, so the manifest the app reads never names a package that is
      # already gone. Anything on the release that this run did not upload
      # belonged to an earlier build.
      - name: 清理 ci 预发布上的旧安装包
        run: |
          set -euo pipefail
          keep="$(cd dist && ls -1)"
          gh release view ci --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if ! grep -qxF -- "$name" <<<"$keep"; then
              echo "removing $name"
              gh release delete-asset ci "$name" --yes
            fi
          done

  # ─── Telegram 通知（每次 master/tag 推送，汇总所有产物状态）──────────────────
  notify-telegram:
    name: Telegram 通知
    needs:
      - test
      - build-android
      - sign-android
      - build-desktop-windows
      - build-desktop-linux
      - build-desktop-macos
    if: >-
      always() && github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 推送到 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.test.outputs.version }}
          COMMIT_MSG: ${{ needs.test.outputs.commit_msg }}
          SHORT_SHA: ${{ needs.test.outputs.short_sha }}
          COMMIT_COUNT: ${{ needs.test.outputs.commit_count }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping."
            exit 0
          fi

          # Prefer the signed APK; fall back to none (unsigned is never sent).
          APK=$(find dist -name 'DAView-*.apk' ! -name '*unsigned*' -print -quit)
          DEB=$(find dist -name '*.deb' -print -quit)
          MSI=$(find dist -name '*.msi' -print -quit)
          DMG=$(find dist -name '*.dmg' -print -quit)

          # ✅ when the file exists, ❌ otherwise.
          status() { [ -n "$1" ] && [ -f "$1" ] && printf '✅' || printf '❌'; }

          MSG=$(printf '%s' "$COMMIT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION=$(printf '<b>DAView</b>  ·  <code>%s</code>\n\n📝 %s\n🔖 <code>%s</code>  ·  <code>%s</code>  ·  +%s commits\n\n──────────────────\n🤖 Android  %s  APK (attached)\n🐧 Linux    %s  .deb\n🪟 Windows  %s  .msi\n🍎 macOS    %s  .dmg\n\n<i>桌面端产物见 CI artifacts。</i>' \
            "$REF" "$MSG" "$VERSION" "$SHORT_SHA" "$COMMIT_COUNT" \
            "$(status "$APK")" "$(status "$DEB")" "$(status "$MSI")" "$(status "$DMG")")

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          if [ -n "$APK" ] && [ -f "$APK" ]; then
            # Desktop packages bundle the JVM and exceed Telegram's 50 MB bot-API
            # limit; only the APK is uploaded. Desktop status is in the caption.
            CAPTION_FILE=$(mktemp)
            printf '%s' "$CAPTION" > "$CAPTION_FILE"
            curl -sS -X POST "${API}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK}" \
              -F "caption=<${CAPTION_FILE}" \
              -F parse_mode=HTML
            rm -f "$CAPTION_FILE"
          else
            curl -sS -X POST "${API}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$CAPTION" \
                '{"chat_id":$c,"text":$t,"parse_mode":"HTML"}')"
          fi

  # ─── GitHub Release（仅 tag）────────────────────────────────────────────────
  release:
    name: 发布到 Release
    needs:
      - test
      - sign-android
      - build-desktop-windows
      - build-desktop-linux
      - build-desktop-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成更新日志
        id: changelog
        run: |
          git fetch --force --tags
          current="${{ github.ref_name }}"
          previous=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${current}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            log=$(git log --oneline "$current")
            count=$(git rev-list --count "$current")
          else
            log=$(git log --oneline "${previous}..${current}")
            count=$(git rev-list --count "${previous}..${current}")
          fi
          {
            echo "log<<EOF"
            echo "$log"
            echo "EOF"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 移除未签名 APK
        run: rm -f dist/*unsigned*.apk

      # What the app checks against: version, package version, and each
      # package's download address with its SHA-256. Attached to the release
      # and pushed to the `updates` branch below, where the app reads it.
      - name: 生成更新清单
        env:
          NOTES: ${{ steps.changelog.outputs.log }}
        run: |
          printf '%s\n' "$NOTES" > /tmp/notes.txt
          python3 scripts/update-manifest.py dist dist/update.json \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --version "${{ needs.test.outputs.version }}" \
            --package-version "${{ needs.test.outputs.package_version }}" \
            --notes-file /tmp/notes.txt
          cat dist/update.json

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DAView ${{ needs.test.outputs.version }}"
          # Explicit globs, so the test-report artifact merged into dist/ is not
          # attached. The unsigned APK is named composeApp-release-unsigned.apk
          # and does not match DAView-*.apk, so only the signed APK is uploaded.
          files: |
            dist/DAView-*.apk
            dist/DAView-*.deb
            dist/DAView-*.msi
            dist/DAView-*.dmg
            dist/update.json
          body: |
            🎉 **DAView ${{ needs.test.outputs.version }}**

            📦 **${{ steps.changelog.outputs.count }} commits since last release**
            ```
            ${{ steps.changelog.outputs.log }}
            ```

            | Platform | File |
            |----------|------|
            | Android | `DAView-${{ needs.test.outputs.version }}.apk` |
            | Linux | `DAView-${{ needs.test.outputs.version }}.deb` |
            | Windows | `DAView-${{ needs.test.outputs.version }}.msi` |
            | macOS | `DAView-${{ needs.test.outputs.version }}.dmg` |
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The app reads the manifest off raw.githubusercontent.com, so it has to
      # be in the repository. On a branch of its own, holding nothing else: a
      # commit to master for every release would set this whole workflow off
      # again. After the release step, so the addresses it carries exist.
      - name: 发布更新清单到 updates 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dist/update.json /tmp/update.json
          git checkout --orphan updates
          git rm -rf --quiet .
          cp /tmp/update.json update.json
          git add update.json
          git commit -m "update manifest for ${{ needs.test.outputs.version }}"
          git push --force origin updates
